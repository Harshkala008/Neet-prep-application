services:
  - type: static_site
    name: neet-master-tracker
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: apps/web/out
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
